name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ffmpeg:
    name: FFmpeg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore FFmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/ffmpeg/**', 'scripts/build-ffmpeg.cjs') }}

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/build-ffmpeg.cjs

      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: vendor/ffmpeg
          if-no-files-found: error

  windows:
    name: Windows
    needs: ffmpeg
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Download FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: vendor/ffmpeg

      - name: Lint
        run: npm run lint

      - name: Package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run package -- --publish never

      - name: Create Draft Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Finalize Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: softshot-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
