<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Softshot</title>
    <link rel="stylesheet" href="./shared-ui.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <header class="settings-titlebar">
      <div class="settings-title-group">
        <img class="settings-logo" src="./assets/app-logo.png" alt="Softshot" draggable="false" />
        <span class="settings-title">Settings</span>
      </div>

      <button id="settings-close-button" class="icon-button close-button" type="button" data-tooltip="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6 18 18" />
          <path d="M18 6 6 18" />
        </svg>
      </button>
    </header>

    <main class="settings-content softshot-scroll">
      <section class="settings-section" aria-labelledby="capture-heading">
        <h2 id="capture-heading" class="settings-section-title">Capture</h2>
        <div class="settings-card">
          <div class="settings-row">
            <div class="settings-text">
              <span class="settings-label">Capture shortcut</span>
              <span id="settings-status" class="settings-description" aria-live="polite">Opens the screenshot and recording tools</span>
            </div>
            <button id="keybind-button" class="softshot-button keybind-button" type="button" aria-label="Change capture shortcut"></button>
          </div>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="audio-heading">
        <h2 id="audio-heading" class="settings-section-title">Audio</h2>
        <div class="settings-card">
          <label class="settings-row" for="microphone-select">
            <span class="settings-text">
              <span class="settings-label">Microphone</span>
              <span class="settings-description">Recorded on its own track</span>
            </span>
            <select id="microphone-select" class="softshot-select settings-select"></select>
          </label>
          <label class="settings-row" for="system-audio-checkbox">
            <span class="settings-text">
              <span class="settings-label">Desktop audio</span>
              <span class="settings-description">Record the sound playing on your PC</span>
            </span>
            <span class="softshot-toggle">
              <input id="system-audio-checkbox" type="checkbox" />
              <span class="softshot-toggle-track" aria-hidden="true">
                <span class="softshot-toggle-thumb"></span>
              </span>
            </span>
          </label>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="general-heading">
        <h2 id="general-heading" class="settings-section-title">General</h2>
        <div class="settings-card">
          <label class="settings-row" for="startup-checkbox">
            <span class="settings-text">
              <span class="settings-label">Launch at startup</span>
              <span class="settings-description">Start Softshot when you sign in</span>
            </span>
            <span class="softshot-toggle">
              <input id="startup-checkbox" type="checkbox" />
              <span class="softshot-toggle-track" aria-hidden="true">
                <span class="softshot-toggle-thumb"></span>
              </span>
            </span>
          </label>
        </div>
      </section>
    </main>

    <script type="module" src="../dist/browser/settings.js"></script>
  </body>
</html>
