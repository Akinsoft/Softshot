<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Softshot</title>
    <link rel="stylesheet" href="./shared-ui.css" />
    <link rel="stylesheet" href="./app-window.css" />
  </head>
  <body>
    <header class="app-titlebar">
      <button id="sidebar-toggle" class="icon-button titlebar-button" type="button" aria-controls="app-sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M9 4v16" />
        </svg>
      </button>
    </header>

    <nav id="app-sidebar" class="app-sidebar" aria-label="Sections">
      <div class="nav-group">
        <button class="nav-item" type="button" data-page="capture">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8V6a2 2 0 0 1 2-2h2" />
            <path d="M16 4h2a2 2 0 0 1 2 2v2" />
            <path d="M20 16v2a2 2 0 0 1-2 2h-2" />
            <path d="M8 20H6a2 2 0 0 1-2-2v-2" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span>Quick Capture</span>
        </button>
        <button class="nav-item" type="button" data-page="clips">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m10 9.5 4.5 2.5-4.5 2.5Z" />
          </svg>
          <span>Clips</span>
        </button>
      </div>

      <div class="nav-footer">
        <button id="app-update-button" class="nav-item update-button" type="button" data-tooltip="Restart Softshot to install the update" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11" />
            <path d="m7 10 5 5 5-5" />
            <path d="M5 20h14" />
          </svg>
          <span>Update</span>
        </button>
        <button class="nav-item" type="button" data-page="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10" />
            <path d="M18 7h2" />
            <circle cx="16" cy="7" r="2" />
            <path d="M4 17h2" />
            <path d="M10 17h10" />
            <circle cx="8" cy="17" r="2" />
          </svg>
          <span>Settings</span>
        </button>
        <span id="app-version" class="app-version"></span>
      </div>
    </nav>

    <main id="app-content" class="app-content softshot-scroll">
      <section id="capture-page" class="app-page" data-page="capture" aria-label="Quick Capture" hidden>
        <section class="settings-section" aria-labelledby="capture-shortcut-heading">
          <h2 id="capture-shortcut-heading" class="settings-section-title">Shortcut</h2>
          <div class="settings-card">
            <div class="settings-row">
              <span class="settings-label">Open Quick Capture</span>
              <span id="capture-shortcut-status" class="row-status" aria-live="polite"></span>
              <button id="capture-shortcut-button" class="softshot-button keybind-button" type="button" aria-label="Change Quick Capture shortcut"></button>
            </div>
          </div>
        </section>
      </section>

      <section id="clips-page" class="app-page" data-page="clips" aria-label="Clips" hidden>
        <section id="clips-control" class="clips-control" data-state="off" aria-label="Recording">
          <div class="clips-control-status">
            <span class="softshot-toggle">
              <input id="clips-enabled-checkbox" type="checkbox" aria-label="Clips" />
              <span class="softshot-toggle-track" aria-hidden="true">
                <span class="softshot-toggle-thumb"></span>
              </span>
            </span>
            <div class="status-text">
              <button id="clips-source-toggle" class="status-title" type="button" aria-expanded="false" aria-controls="clips-control-source">
                <span class="status-dot" aria-hidden="true"></span>
                <img id="clips-status-icon" class="status-icon" alt="" hidden />
                <span id="clips-status-title" class="status-title-text" aria-live="polite"></span>
                <svg class="status-chevron" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m7 10 5 5 5-5" />
                </svg>
              </button>
              <span id="clips-status-detail" class="status-detail"></span>
            </div>
            <span id="clips-status-hint" class="status-detail status-hint" hidden>
              <span id="clips-status-hint-before"></span>
              <button id="clips-page-shortcut-button" class="softshot-button keybind-button inline-keybind-button" type="button" aria-label="Change save clip shortcut"></button>
              <span id="clips-status-hint-after"></span>
              <span id="clips-page-shortcut-status" class="row-status" aria-live="polite"></span>
            </span>
            <button id="clips-retry-button" class="softshot-button" type="button" hidden>Try again</button>
            <button id="clips-settings-button" class="icon-button" type="button" data-tooltip="Clip settings" aria-label="Clip settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10" />
                <path d="M18 7h2" />
                <circle cx="16" cy="7" r="2" />
                <path d="M4 17h2" />
                <path d="M10 17h10" />
                <circle cx="8" cy="17" r="2" />
              </svg>
            </button>
          </div>
          <div id="clips-control-source" class="clips-control-source" hidden>
            <select id="clips-source-kind-select" class="softshot-select source-select source-kind-select" aria-label="Capture method">
              <button type="button"><selectedcontent></selectedcontent></button>
              <option value="display">
                <svg class="option-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="12" rx="2" />
                  <path d="M8 20h8" />
                  <path d="M12 16v4" />
                </svg>
                <span class="option-label">Monitor</span>
              </option>
              <option value="window">
                <svg class="option-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="2" />
                  <path d="M3 9h18" />
                </svg>
                <span class="option-label">App</span>
              </option>
              <option value="game">
                <svg class="option-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 7h10a5 5 0 0 1 4.9 6l-.6 3a3 3 0 0 1-5.1 1.5L14.5 16h-5l-1.7 1.5a3 3 0 0 1-5.1-1.5l-.6-3A5 5 0 0 1 7 7Z" />
                  <path d="M8 10v4" />
                  <path d="M6 12h4" />
                  <path d="M15.5 11h.01" />
                  <path d="M17.5 13h.01" />
                </svg>
                <span class="option-label">Games</span>
              </option>
            </select>
            <select id="clips-display-select" class="softshot-select source-select" aria-label="Monitor">
              <button type="button"><selectedcontent></selectedcontent></button>
            </select>
            <select id="clips-window-select" class="softshot-select source-select" aria-label="App" hidden>
              <button type="button"><selectedcontent></selectedcontent></button>
            </select>
            <span id="clips-game-detail" class="source-detail" hidden>Records the game you're playing as soon as it opens.</span>
          </div>
        </section>

        <section class="clip-library" aria-label="Saved clips">
          <div id="clip-library-header" class="clip-library-header" hidden>
            <p id="clip-library-summary" class="clip-library-summary"></p>
            <button id="clip-library-open-folder" class="softshot-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
              </svg>
              Open folder
            </button>
          </div>

          <div id="clip-library-groups" class="clip-library-groups"></div>

          <div id="clip-library-empty" class="clip-library-empty" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m10 9.5 4.5 2.5-4.5 2.5Z" />
            </svg>
            <h2>No clips yet</h2>
            <p id="clip-library-empty-detail"></p>
          </div>
        </section>
      </section>

      <section id="settings-page" class="app-page" data-page="settings" aria-label="Settings" hidden>
        <section class="settings-section" aria-labelledby="settings-general-heading">
          <h2 id="settings-general-heading" class="settings-section-title">General</h2>
          <div class="settings-card">
            <label class="settings-row" for="startup-checkbox">
              <span class="settings-label">Launch at startup</span>
              <span class="softshot-toggle">
                <input id="startup-checkbox" type="checkbox" />
                <span class="softshot-toggle-track" aria-hidden="true">
                  <span class="softshot-toggle-thumb"></span>
                </span>
              </span>
            </label>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="settings-clips-heading">
          <h2 id="settings-clips-heading" class="settings-section-title">Clips</h2>
          <div class="settings-card">
            <div class="settings-row">
              <span class="settings-label">Save clip</span>
              <span id="clips-shortcut-status" class="row-status" aria-live="polite"></span>
              <button id="clips-shortcut-button" class="softshot-button keybind-button" type="button" aria-label="Change save clip shortcut"></button>
            </div>
            <label class="settings-row" for="clips-saved-toast-checkbox">
              <span class="settings-label">Saved clip popup</span>
              <span class="softshot-toggle">
                <input id="clips-saved-toast-checkbox" type="checkbox" />
                <span class="softshot-toggle-track" aria-hidden="true">
                  <span class="softshot-toggle-thumb"></span>
                </span>
              </span>
            </label>
            <div class="settings-row">
              <span class="settings-label">Clips folder</span>
              <span id="clips-directory-path" class="row-value path-text"></span>
              <div class="row-controls">
                <button id="clips-directory-open" class="softshot-button" type="button">Open</button>
                <button id="clips-directory-change" class="softshot-button" type="button">Change</button>
              </div>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="settings-clip-quality-heading">
          <h2 id="settings-clip-quality-heading" class="settings-section-title">Clip quality</h2>
          <div class="settings-card">
            <div class="settings-row">
              <span class="settings-label-group">
                <label class="settings-label" for="clips-duration-select">Clip length</label>
                <button id="clips-duration-help" class="help-button" type="button" aria-label="Memory used by each clip length">?</button>
              </span>
              <select id="clips-duration-select" class="softshot-select settings-select"></select>
            </div>
            <label class="settings-row" for="clips-quality-select">
              <span class="settings-label">Resolution</span>
              <select id="clips-quality-select" class="softshot-select settings-select"></select>
            </label>
            <label class="settings-row" for="clips-fps-select">
              <span class="settings-label">Frame rate</span>
              <select id="clips-fps-select" class="softshot-select settings-select"></select>
            </label>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="settings-audio-heading">
          <h2 id="settings-audio-heading" class="settings-section-title">Audio</h2>
          <div class="settings-card">
            <label class="settings-row" for="microphone-select">
              <span class="settings-label">Microphone</span>
              <select id="microphone-select" class="softshot-select settings-select"></select>
            </label>
            <label class="settings-row" for="system-audio-checkbox">
              <span class="settings-label">Desktop audio</span>
              <span class="softshot-toggle">
                <input id="system-audio-checkbox" type="checkbox" />
                <span class="softshot-toggle-track" aria-hidden="true">
                  <span class="softshot-toggle-thumb"></span>
                </span>
              </span>
            </label>
          </div>
        </section>
      </section>
    </main>

    <div id="app-toast" class="app-toast" role="status" hidden></div>

    <script type="module" src="../dist/browser/app-window.js"></script>
  </body>
</html>
