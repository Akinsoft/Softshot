<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: blob: data:; media-src 'self' file: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Softshot</title>
    <link rel="stylesheet" href="./shared-ui.css" />
    <link rel="stylesheet" href="./app-window.css" />
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <header class="app-titlebar">
      <button id="sidebar-toggle" class="icon-button titlebar-button" type="button" aria-controls="app-sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M9 4v16" />
        </svg>
      </button>
    </header>

    <nav id="app-sidebar" class="app-sidebar" aria-label="Sections">
      <div class="nav-group">
        <button class="nav-item" type="button" data-page="capture">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8V6a2 2 0 0 1 2-2h2" />
            <path d="M16 4h2a2 2 0 0 1 2 2v2" />
            <path d="M20 16v2a2 2 0 0 1-2 2h-2" />
            <path d="M8 20H6a2 2 0 0 1-2-2v-2" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span>Quick Capture</span>
        </button>
        <button class="nav-item" type="button" data-page="clips">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m10 9.5 4.5 2.5-4.5 2.5Z" />
          </svg>
          <span>Clips</span>
        </button>
      </div>

      <section id="recent-clips" class="recent-clips" aria-labelledby="recent-clips-title">
        <button id="recent-clips-toggle" class="recent-clips-toggle" type="button" aria-controls="recent-clips-body">
          <span id="recent-clips-title">Recently Viewed</span>
          <svg class="recent-clips-chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 14 5-5 5 5" />
          </svg>
        </button>
        <div id="recent-clips-body" class="recent-clips-body">
          <div class="recent-clips-scroll softshot-scroll">
            <ul id="recent-clips-list" class="recent-clips-list"></ul>
            <p id="recent-clips-empty" class="recent-clips-empty">Clips you open, copy or find in their folder show up here.</p>
          </div>
        </div>
      </section>

      <div class="nav-footer">
        <button id="app-update-button" class="nav-item update-button" type="button" data-tooltip="Restart Softshot to install the update" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11" />
            <path d="m7 10 5 5 5-5" />
            <path d="M5 20h14" />
          </svg>
          <span>Update</span>
        </button>
        <button class="nav-item" type="button" data-page="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10" />
            <path d="M18 7h2" />
            <circle cx="16" cy="7" r="2" />
            <path d="M4 17h2" />
            <path d="M10 17h10" />
            <circle cx="8" cy="17" r="2" />
          </svg>
          <span>Settings</span>
        </button>
        <span id="app-version" class="app-version"></span>
      </div>
    </nav>

    <main id="app-content" class="app-content softshot-scroll">
      <section id="capture-page" class="app-page" data-page="capture" aria-label="Quick Capture" hidden>
        <section class="settings-section" aria-labelledby="capture-shortcut-heading">
          <h2 id="capture-shortcut-heading" class="settings-section-title">Shortcut</h2>
          <div class="settings-card">
            <div class="settings-row">
              <span class="settings-label">Open Quick Capture</span>
              <span id="capture-shortcut-status" class="row-status" aria-live="polite"></span>
              <button id="capture-shortcut-button" class="softshot-button keybind-button" type="button" aria-label="Change Quick Capture shortcut"></button>
            </div>
          </div>
        </section>
      </section>

      <section id="clips-page" class="app-page clips-page" data-page="clips" aria-label="Clips" hidden>
        <section id="clips-control" class="clips-control" data-state="off" aria-label="Recording">
          <div class="clips-control-status">
            <span class="softshot-toggle">
              <input id="clips-enabled-checkbox" type="checkbox" aria-label="Clips" />
              <span class="softshot-toggle-track" aria-hidden="true">
                <span class="softshot-toggle-thumb"></span>
              </span>
            </span>
            <div class="status-text">
              <button id="clips-source-toggle" class="status-title" type="button" aria-expanded="false" aria-controls="clips-control-source">
                <span class="status-dot" aria-hidden="true"></span>
                <img id="clips-status-icon" class="status-icon" alt="" hidden />
                <span id="clips-status-title" class="status-title-text" aria-live="polite"></span>
                <svg class="status-chevron" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m7 10 5 5 5-5" />
                </svg>
              </button>
              <span id="clips-status-detail" class="status-detail"></span>
            </div>
            <span id="clips-status-hint" class="status-detail status-hint" hidden>
              <span id="clips-status-hint-before"></span>
              <button id="clips-page-shortcut-button" class="softshot-button keybind-button inline-keybind-button" type="button" aria-label="Change save clip shortcut"></button>
              <span id="clips-status-hint-after"></span>
              <span id="clips-page-shortcut-status" class="row-status" aria-live="polite"></span>
            </span>
            <button id="clips-retry-button" class="softshot-button" type="button" hidden>Try again</button>
            <button id="clips-settings-button" class="icon-button" type="button" data-tooltip="Clip settings" aria-label="Clip settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10" />
                <path d="M18 7h2" />
                <circle cx="16" cy="7" r="2" />
                <path d="M4 17h2" />
                <path d="M10 17h10" />
                <circle cx="8" cy="17" r="2" />
              </svg>
            </button>
          </div>
          <div id="clips-control-source" class="clips-control-source" hidden>
            <select id="clips-source-kind-select" class="softshot-select source-select source-kind-select" aria-label="Capture method">
              <button type="button"><selectedcontent></selectedcontent></button>
              <option value="display">
                <svg class="option-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="12" rx="2" />
                  <path d="M8 20h8" />
                  <path d="M12 16v4" />
                </svg>
                <span class="option-label">Monitor</span>
              </option>
              <option value="window">
                <svg class="option-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="2" />
                  <path d="M3 9h18" />
                </svg>
                <span class="option-label">App</span>
              </option>
              <option value="game">
                <svg class="option-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 7h10a5 5 0 0 1 4.9 6l-.6 3a3 3 0 0 1-5.1 1.5L14.5 16h-5l-1.7 1.5a3 3 0 0 1-5.1-1.5l-.6-3A5 5 0 0 1 7 7Z" />
                  <path d="M8 10v4" />
                  <path d="M6 12h4" />
                  <path d="M15.5 11h.01" />
                  <path d="M17.5 13h.01" />
                </svg>
                <span class="option-label">Games</span>
              </option>
            </select>
            <select id="clips-display-select" class="softshot-select source-select" aria-label="Monitor">
              <button type="button"><selectedcontent></selectedcontent></button>
            </select>
            <select id="clips-window-select" class="softshot-select source-select" aria-label="App" hidden>
              <button type="button"><selectedcontent></selectedcontent></button>
            </select>
            <span id="clips-game-detail" class="source-detail" hidden>Records the game you're playing as soon as it opens.</span>
          </div>
        </section>

        <section class="clip-library" aria-label="Saved clips">
          <div id="clip-library-header" class="clip-library-header" hidden>
            <p id="clip-library-summary" class="clip-library-summary"></p>
            <button id="clip-library-open-folder" class="softshot-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
              </svg>
              Open folder
            </button>
          </div>

          <div id="clip-library-groups" class="clip-library-groups"></div>

          <div id="clip-library-empty" class="clip-library-empty" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m10 9.5 4.5 2.5-4.5 2.5Z" />
            </svg>
            <h2>No clips yet</h2>
            <p id="clip-library-empty-detail"></p>
          </div>
        </section>
      </section>

      <section id="settings-page" class="app-page" data-page="settings" aria-label="Settings" hidden>
        <section class="settings-section" aria-labelledby="settings-general-heading">
          <h2 id="settings-general-heading" class="settings-section-title">General</h2>
          <div class="settings-card">
            <label class="settings-row" for="startup-checkbox">
              <span class="settings-label">Launch at startup</span>
              <span class="softshot-toggle">
                <input id="startup-checkbox" type="checkbox" />
                <span class="softshot-toggle-track" aria-hidden="true">
                  <span class="softshot-toggle-thumb"></span>
                </span>
              </span>
            </label>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="settings-clips-heading">
          <h2 id="settings-clips-heading" class="settings-section-title">Clips</h2>
          <div class="settings-card">
            <div class="settings-row">
              <span class="settings-label">Save clip</span>
              <span id="clips-shortcut-status" class="row-status" aria-live="polite"></span>
              <button id="clips-shortcut-button" class="softshot-button keybind-button" type="button" aria-label="Change save clip shortcut"></button>
            </div>
            <label class="settings-row" for="clips-saved-toast-checkbox">
              <span class="settings-label">Saved clip popup</span>
              <span class="softshot-toggle">
                <input id="clips-saved-toast-checkbox" type="checkbox" />
                <span class="softshot-toggle-track" aria-hidden="true">
                  <span class="softshot-toggle-thumb"></span>
                </span>
              </span>
            </label>
            <div class="settings-row">
              <span class="settings-label">Clips folder</span>
              <span id="clips-directory-path" class="row-value path-text"></span>
              <div class="row-controls">
                <button id="clips-directory-open" class="softshot-button" type="button">Open</button>
                <button id="clips-directory-change" class="softshot-button" type="button">Change</button>
              </div>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="settings-clip-quality-heading">
          <h2 id="settings-clip-quality-heading" class="settings-section-title">Clip quality</h2>
          <div class="settings-card">
            <div class="settings-row">
              <span class="settings-label-group">
                <label class="settings-label" for="clips-duration-select">Clip length</label>
                <button id="clips-duration-help" class="help-button" type="button" aria-label="Memory used by each clip length">?</button>
              </span>
              <select id="clips-duration-select" class="softshot-select settings-select"></select>
            </div>
            <label class="settings-row" for="clips-quality-select">
              <span class="settings-label">Resolution</span>
              <select id="clips-quality-select" class="softshot-select settings-select"></select>
            </label>
            <label class="settings-row" for="clips-fps-select">
              <span class="settings-label">Frame rate</span>
              <select id="clips-fps-select" class="softshot-select settings-select"></select>
            </label>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="settings-audio-heading">
          <h2 id="settings-audio-heading" class="settings-section-title">Audio</h2>
          <div class="settings-card">
            <label class="settings-row" for="microphone-select">
              <span class="settings-label">Microphone</span>
              <select id="microphone-select" class="softshot-select settings-select"></select>
            </label>
            <label class="settings-row" for="system-audio-checkbox">
              <span class="settings-label">Desktop audio</span>
              <span class="softshot-toggle">
                <input id="system-audio-checkbox" type="checkbox" />
                <span class="softshot-toggle-track" aria-hidden="true">
                  <span class="softshot-toggle-thumb"></span>
                </span>
              </span>
            </label>
          </div>
        </section>
      </section>

      <section id="editor-page" class="app-page editor-page" aria-label="Editor" hidden></section>
    </main>

    <div id="app-toast" class="app-toast" role="status" hidden></div>

    <template id="editor-template">
      <div class="video-editor">
        <header class="editor-header">
          <div class="editor-title-group">
            <button id="editor-back-button" class="icon-button" type="button" data-tooltip="Back" aria-label="Back">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="m11 6-6 6 6 6" />
              </svg>
            </button>
            <span id="editor-title" class="editor-title"></span>
            <span id="editor-status" class="editor-status" aria-live="polite"></span>
          </div>

          <div class="editor-actions">
            <button id="editor-copy-button" class="icon-button" type="button" data-tooltip="Copy" aria-label="Copy">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="10" height="12" rx="2" />
                <path d="M6 16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            </button>

            <button id="editor-save-button" class="icon-button" type="button" data-tooltip="Save as" aria-label="Save as">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 4h12l2 2v14H5Z" />
                <path d="M8 4v6h8V4" />
                <path d="M8 17h8" />
              </svg>
            </button>

            <button id="editor-export-button" class="icon-button" type="button" data-tooltip="Export" data-tooltip-shortcut="Ctrl+E" aria-label="Export">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15V3" />
                <path d="m7 8 5-5 5 5" />
                <path d="M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4" />
              </svg>
            </button>
          </div>
        </header>

        <div class="editor-content">
          <section id="preview-area" class="preview-area">
            <video id="editor-video" class="editor-video" playsinline></video>
          </section>

          <section class="timeline-panel">
            <div class="editor-controls" role="toolbar" aria-label="Playback and editing">
              <div class="control-group edit-controls">
                <button id="undo-button" class="control-button" type="button" disabled data-tooltip="Undo" data-tooltip-shortcut="Ctrl+Z" aria-label="Undo">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 14 4 9l5-5" />
                    <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
                  </svg>
                </button>
                <button id="redo-button" class="control-button" type="button" disabled data-tooltip="Redo" data-tooltip-shortcut="Ctrl+Y" aria-label="Redo">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m15 14 5-5-5-5" />
                    <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
                  </svg>
                </button>
                <span class="control-divider" aria-hidden="true"></span>
                <button id="hand-button" class="control-button" type="button" data-tooltip="Hand" data-tooltip-shortcut="B" aria-label="Hand" aria-pressed="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 14.2V6.5a1.5 1.5 0 0 1 3 0V12" />
                    <path d="M11 11.5V5a1.5 1.5 0 0 1 3 0v6.5" />
                    <path d="M14 11.5V6.5a1.5 1.5 0 0 1 3 0V12" />
                    <path d="M17 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2l-3.5-4.2a1.5 1.5 0 0 1 2.3-1.9L8 14.2" />
                  </svg>
                </button>
                <button id="cut-button" class="control-button" type="button" data-tooltip="Cut" data-tooltip-shortcut="C" aria-label="Cut" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="6" cy="6" r="3" />
                    <circle cx="6" cy="18" r="3" />
                    <path d="m8.1 8.1 3.9 3.9" />
                    <path d="M20 4 8.1 15.9" />
                    <path d="m14.8 14.8 5.2 5.2" />
                  </svg>
                </button>
                <button id="delete-clip-button" class="control-button" type="button" disabled data-tooltip="Delete clip" data-tooltip-shortcut="Del" aria-label="Delete clip">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16" />
                    <path d="M9 7V4.5h6V7" />
                    <path d="m6 7 1 12.2a2 2 0 0 0 2 1.8h6a2 2 0 0 0 2-1.8L18 7" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                  </svg>
                </button>
                <span class="control-divider" aria-hidden="true"></span>
                <button id="snap-button" class="control-button" type="button" data-tooltip="Snapping" data-tooltip-shortcut="N" aria-label="Snapping" aria-pressed="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 4h4v8a3 3 0 0 0 6 0V4h4v8a7 7 0 0 1-14 0Z" />
                    <path d="M5 8h4" />
                    <path d="M15 8h4" />
                  </svg>
                </button>
              </div>

              <div class="control-group transport-controls">
                <button id="jump-start-button" class="control-button" type="button" data-tooltip="Go to start" data-tooltip-shortcut="Home" aria-label="Go to start">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6v12" />
                    <path d="M18 6.5v11L9.5 12Z" />
                  </svg>
                </button>
                <button id="step-back-button" class="control-button" type="button" data-tooltip="Previous frame" data-tooltip-shortcut="Left" aria-label="Previous frame">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m14.5 6-6 6 6 6" />
                  </svg>
                </button>
                <button id="play-button" class="play-button" type="button" data-tooltip="Play" data-tooltip-shortcut="Space" aria-label="Play" data-state="play">
                  <span class="play-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7Z" />
                    </svg>
                  </span>
                  <span class="pause-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <rect x="6.5" y="5.5" width="4" height="13" rx="1" />
                      <rect x="13.5" y="5.5" width="4" height="13" rx="1" />
                    </svg>
                  </span>
                </button>
                <button id="step-forward-button" class="control-button" type="button" data-tooltip="Next frame" data-tooltip-shortcut="Right" aria-label="Next frame">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9.5 6 6 6-6 6" />
                  </svg>
                </button>
                <button id="jump-end-button" class="control-button" type="button" data-tooltip="Go to end" data-tooltip-shortcut="End" aria-label="Go to end">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6v12" />
                    <path d="M6 6.5v11l8.5-5.5Z" />
                  </svg>
                </button>
              </div>

              <div class="control-group playback-status">
                <div id="playback-volume" class="playback-volume">
                  <button id="playback-mute-button" class="control-button playback-mute-button" type="button" data-tooltip="Mute" aria-label="Mute">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M11 5 6 9H3v6h3l5 4Z" />
                      <path class="playback-volume-wave" d="M15.5 8.5a5 5 0 0 1 0 7" />
                      <path class="playback-volume-wave" d="M18.5 5.5a9 9 0 0 1 0 13" />
                      <path class="playback-volume-cross" d="m16 9.5 5 5" />
                      <path class="playback-volume-cross" d="m21 9.5-5 5" />
                    </svg>
                    <span id="playback-volume-value" class="playback-volume-value" aria-hidden="true"></span>
                  </button>
                  <input id="playback-volume-slider" class="range-input playback-volume-slider" type="range" min="0" max="100" step="1" value="100" data-tooltip="Playback volume" aria-label="Playback volume" />
                </div>
                <span class="control-divider" aria-hidden="true"></span>
                <div class="timeline-time" aria-label="Playback time">
                  <span id="current-time">00:00.00</span>
                  <span class="time-separator">/</span>
                  <span id="total-time">00:00.00</span>
                </div>
              </div>
            </div>

            <div class="timeline-body">
              <div class="track-headers">
                <div class="track-header ruler-header">
                  <button id="zoom-out-button" class="control-button zoom-button" type="button" data-tooltip="Zoom out" data-tooltip-shortcut="-" aria-label="Zoom out">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="11" cy="11" r="6" />
                      <path d="m20 20-4.5-4.5" />
                      <path d="M8.5 11h5" />
                    </svg>
                  </button>
                  <input id="zoom-slider" class="range-input zoom-slider" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline zoom" />
                  <button id="zoom-in-button" class="control-button zoom-button" type="button" data-tooltip="Zoom in" data-tooltip-shortcut="=" aria-label="Zoom in">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="11" cy="11" r="6" />
                      <path d="m20 20-4.5-4.5" />
                      <path d="M8.5 11h5" />
                      <path d="M11 8.5v5" />
                    </svg>
                  </button>
                  <button id="zoom-fit-button" class="control-button zoom-button" type="button" data-tooltip="Fit timeline" data-tooltip-shortcut="\" aria-label="Fit timeline">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 12h16" />
                      <path d="m8 8-4 4 4 4" />
                      <path d="m16 8 4 4-4 4" />
                    </svg>
                  </button>
                </div>
                <div class="track-header video-track-header">
                  <span class="track-name">Video</span>
                  <button id="video-track-toggle" class="track-toggle" type="button" data-tooltip="Hide video" aria-label="Hide video">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <rect x="3" y="5" width="18" height="14" rx="2" />
                      <path d="M7.5 5v14" />
                      <path d="M16.5 5v14" />
                      <path d="M3 9.7h4.5" />
                      <path d="M3 14.3h4.5" />
                      <path d="M16.5 9.7H21" />
                      <path d="M16.5 14.3H21" />
                    </svg>
                  </button>
                </div>
                <div id="audio-track-headers" class="audio-track-headers"></div>
              </div>

              <div id="timeline" class="timeline" style="--playhead: 0%" data-tool="hand">
                <div id="timeline-track" class="timeline-track" role="group" aria-label="Video timeline">
                  <div id="timeline-ruler" class="timeline-ruler" aria-hidden="true"></div>
                  <div id="video-lane" class="timeline-lane video-lane">
                    <div id="timeline-segments" class="timeline-segments"></div>
                  </div>
                  <div id="audio-tracks" class="audio-lanes" aria-label="Audio tracks" hidden></div>
                  <div class="timeline-playhead" aria-hidden="true"></div>
                  <div id="timeline-snap-indicator" class="timeline-snap-indicator" aria-hidden="true" hidden></div>
                  <div id="timeline-cut-indicator" class="timeline-cut-indicator" aria-hidden="true" hidden>
                    <span id="timeline-cut-time" class="timeline-cut-time"></span>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>

        <dialog id="export-dialog" class="export-dialog" aria-labelledby="export-title">
          <header class="export-header">
            <h2 id="export-title" class="export-title">Export</h2>
            <button id="export-close-button" class="icon-button close-button" type="button" aria-label="Close export">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6 18 18" />
                <path d="M18 6 6 18" />
              </svg>
            </button>
          </header>

          <div class="export-body">
            <nav id="export-preset-list" class="export-preset-list softshot-scroll" aria-label="Export presets"></nav>

            <section class="export-settings softshot-scroll" aria-labelledby="export-preset-name">
              <div class="export-preset-heading">
                <span id="export-preset-name" class="export-preset-name"></span>
                <span id="export-preset-description" class="export-preset-description"></span>
              </div>

              <div class="export-fields">
                <label class="export-field">
                  <span class="export-field-label">Format</span>
                  <select id="export-format-select" class="softshot-select"></select>
                </label>
                <label id="export-codec-field" class="export-field">
                  <span class="export-field-label">Video codec</span>
                  <select id="export-codec-select" class="softshot-select"></select>
                </label>
                <label id="export-resolution-field" class="export-field">
                  <span class="export-field-label">Resolution</span>
                  <select id="export-resolution-select" class="softshot-select"></select>
                </label>
                <label id="export-fps-field" class="export-field">
                  <span class="export-field-label">Frame rate</span>
                  <select id="export-fps-select" class="softshot-select"></select>
                </label>
                <label id="export-quality-field" class="export-field">
                  <span class="export-field-label">Quality</span>
                  <select id="export-quality-select" class="softshot-select"></select>
                </label>
                <label id="export-size-field" class="export-field">
                  <span class="export-field-label">Size limit</span>
                  <select id="export-size-select" class="softshot-select"></select>
                </label>
                <label id="export-audio-field" class="export-field">
                  <span class="export-field-label">Audio</span>
                  <select id="export-audio-select" class="softshot-select"></select>
                </label>
                <label id="export-upscale-field" class="export-field" for="export-upscale-checkbox">
                  <span class="export-field-label">Upscaling</span>
                  <span class="export-toggle-row">
                    <span class="softshot-toggle">
                      <input id="export-upscale-checkbox" type="checkbox" />
                      <span class="softshot-toggle-track" aria-hidden="true">
                        <span class="softshot-toggle-thumb"></span>
                      </span>
                    </span>
                    <span class="export-toggle-text">Enlarge smaller videos</span>
                  </span>
                </label>
              </div>

              <ul id="export-messages" class="export-messages" aria-live="polite"></ul>
            </section>
          </div>

          <footer class="export-footer">
            <div id="export-summary" class="export-summary"></div>
            <div id="export-progress" class="export-progress" hidden>
              <div class="export-progress-track">
                <span id="export-progress-bar" class="export-progress-bar"></span>
              </div>
              <span id="export-progress-text" class="export-progress-text"></span>
            </div>
            <div class="export-actions">
              <div class="export-destination" role="radiogroup" aria-label="Export destination">
                <label class="export-destination-option">
                  <input type="radio" name="export-destination" value="file" checked />
                  <span>Save file</span>
                </label>
                <label class="export-destination-option">
                  <input type="radio" name="export-destination" value="clipboard" />
                  <span>Copy</span>
                </label>
              </div>
              <button id="export-cancel-button" class="softshot-button" type="button">Cancel</button>
              <button id="export-start-button" class="softshot-button primary" type="button">Export</button>
            </div>
          </footer>
        </dialog>
      </div>
    </template>

    <script type="importmap">
      {
        "imports": {
          "gifenc": "../node_modules/gifenc/dist/gifenc.esm.js",
          "mediabunny": "../node_modules/mediabunny/dist/bundles/mediabunny.min.mjs"
        }
      }
    </script>

    <script type="module" src="../dist/browser/app-window.js"></script>
  </body>
</html>
