<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' file: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Softshot</title>
    <link rel="stylesheet" href="./shared-ui.css" />
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <header class="editor-titlebar">
      <div class="editor-title-group">
        <img class="editor-logo" src="./assets/app-logo.png" alt="Softshot" draggable="false" />
        <span id="editor-status" class="editor-status" aria-live="polite"></span>
      </div>

      <div class="editor-actions">
        <button id="editor-copy-button" class="icon-button" type="button" data-tooltip="Copy" aria-label="Copy">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="10" height="12" rx="2" />
            <path d="M6 16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        </button>

        <button id="editor-save-button" class="icon-button" type="button" data-tooltip="Save as" aria-label="Save as">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h12l2 2v14H5Z" />
            <path d="M8 4v6h8V4" />
            <path d="M8 17h8" />
          </svg>
        </button>
      </div>

      <button id="editor-close-button" class="icon-button close-button" type="button" data-tooltip="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6 18 18" />
          <path d="M18 6 6 18" />
        </svg>
      </button>
    </header>

    <main class="editor-content">
      <section id="preview-area" class="preview-area">
        <video id="editor-video" class="editor-video" playsinline></video>
      </section>

      <section class="timeline-panel">
        <div class="editor-controls" role="toolbar" aria-label="Playback and editing">
          <div class="control-group edit-controls">
            <button id="undo-button" class="control-button" type="button" disabled data-tooltip="Undo" data-tooltip-shortcut="Ctrl+Z" aria-label="Undo">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 14 4 9l5-5" />
                <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
              </svg>
            </button>
            <button id="redo-button" class="control-button" type="button" disabled data-tooltip="Redo" data-tooltip-shortcut="Ctrl+Y" aria-label="Redo">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 14 5-5-5-5" />
                <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
              </svg>
            </button>
            <span class="control-divider" aria-hidden="true"></span>
            <button id="hand-button" class="control-button" type="button" data-tooltip="Hand" data-tooltip-shortcut="B" aria-label="Hand" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 14.2V6.5a1.5 1.5 0 0 1 3 0V12" />
                <path d="M11 11.5V5a1.5 1.5 0 0 1 3 0v6.5" />
                <path d="M14 11.5V6.5a1.5 1.5 0 0 1 3 0V12" />
                <path d="M17 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2l-3.5-4.2a1.5 1.5 0 0 1 2.3-1.9L8 14.2" />
              </svg>
            </button>
            <button id="cut-button" class="control-button" type="button" data-tooltip="Cut" data-tooltip-shortcut="C" aria-label="Cut" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="6" cy="6" r="3" />
                <circle cx="6" cy="18" r="3" />
                <path d="m8.1 8.1 3.9 3.9" />
                <path d="M20 4 8.1 15.9" />
                <path d="m14.8 14.8 5.2 5.2" />
              </svg>
            </button>
            <button id="delete-clip-button" class="control-button" type="button" disabled data-tooltip="Delete clip" data-tooltip-shortcut="Del" aria-label="Delete clip">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16" />
                <path d="M9 7V4.5h6V7" />
                <path d="m6 7 1 12.2a2 2 0 0 0 2 1.8h6a2 2 0 0 0 2-1.8L18 7" />
                <path d="M10 11v6" />
                <path d="M14 11v6" />
              </svg>
            </button>
            <span class="control-divider" aria-hidden="true"></span>
            <button id="snap-button" class="control-button" type="button" data-tooltip="Snapping" data-tooltip-shortcut="N" aria-label="Snapping" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 4h4v8a3 3 0 0 0 6 0V4h4v8a7 7 0 0 1-14 0Z" />
                <path d="M5 8h4" />
                <path d="M15 8h4" />
              </svg>
            </button>
          </div>

          <div class="control-group transport-controls">
            <button id="jump-start-button" class="control-button" type="button" data-tooltip="Go to start" data-tooltip-shortcut="Home" aria-label="Go to start">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6v12" />
                <path d="M18 6.5v11L9.5 12Z" />
              </svg>
            </button>
            <button id="step-back-button" class="control-button" type="button" data-tooltip="Previous frame" data-tooltip-shortcut="Left" aria-label="Previous frame">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m14.5 6-6 6 6 6" />
              </svg>
            </button>
            <button id="play-button" class="play-button" type="button" data-tooltip="Play" data-tooltip-shortcut="Space" aria-label="Play" data-state="play">
              <span class="play-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7Z" />
                </svg>
              </span>
              <span class="pause-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="6.5" y="5.5" width="4" height="13" rx="1" />
                  <rect x="13.5" y="5.5" width="4" height="13" rx="1" />
                </svg>
              </span>
            </button>
            <button id="step-forward-button" class="control-button" type="button" data-tooltip="Next frame" data-tooltip-shortcut="Right" aria-label="Next frame">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9.5 6 6 6-6 6" />
              </svg>
            </button>
            <button id="jump-end-button" class="control-button" type="button" data-tooltip="Go to end" data-tooltip-shortcut="End" aria-label="Go to end">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6v12" />
                <path d="M6 6.5v11l8.5-5.5Z" />
              </svg>
            </button>
          </div>

          <div class="timeline-time" aria-label="Playback time">
            <span id="current-time">00:00.00</span>
            <span class="time-separator">/</span>
            <span id="total-time">00:00.00</span>
          </div>
        </div>

        <div class="timeline-body">
          <div class="track-headers">
            <div class="track-header ruler-header">
              <button id="zoom-out-button" class="control-button zoom-button" type="button" data-tooltip="Zoom out" data-tooltip-shortcut="-" aria-label="Zoom out">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="6" />
                  <path d="m20 20-4.5-4.5" />
                  <path d="M8.5 11h5" />
                </svg>
              </button>
              <input id="zoom-slider" class="range-input zoom-slider" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline zoom" />
              <button id="zoom-in-button" class="control-button zoom-button" type="button" data-tooltip="Zoom in" data-tooltip-shortcut="=" aria-label="Zoom in">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="6" />
                  <path d="m20 20-4.5-4.5" />
                  <path d="M8.5 11h5" />
                  <path d="M11 8.5v5" />
                </svg>
              </button>
              <button id="zoom-fit-button" class="control-button zoom-button" type="button" data-tooltip="Fit timeline" data-tooltip-shortcut="\" aria-label="Fit timeline">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 12h16" />
                  <path d="m8 8-4 4 4 4" />
                  <path d="m16 8 4 4-4 4" />
                </svg>
              </button>
            </div>
            <div class="track-header video-track-header">
              <span class="track-name">Video</span>
              <button id="video-track-toggle" class="track-toggle" type="button" data-tooltip="Hide video" aria-label="Hide video">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="M7.5 5v14" />
                  <path d="M16.5 5v14" />
                  <path d="M3 9.7h4.5" />
                  <path d="M3 14.3h4.5" />
                  <path d="M16.5 9.7H21" />
                  <path d="M16.5 14.3H21" />
                </svg>
              </button>
            </div>
            <div id="audio-track-headers" class="audio-track-headers"></div>
          </div>

          <div id="timeline" class="timeline" style="--playhead: 0%" data-tool="hand">
            <div id="timeline-track" class="timeline-track" role="group" aria-label="Video timeline">
              <div id="timeline-ruler" class="timeline-ruler" aria-hidden="true"></div>
              <div id="video-lane" class="timeline-lane video-lane">
                <div id="timeline-segments" class="timeline-segments"></div>
              </div>
              <div id="audio-tracks" class="audio-lanes" aria-label="Audio tracks" hidden></div>
              <div class="timeline-playhead" aria-hidden="true"></div>
              <div id="timeline-snap-indicator" class="timeline-snap-indicator" aria-hidden="true" hidden></div>
              <div id="timeline-cut-indicator" class="timeline-cut-indicator" aria-hidden="true" hidden>
                <span id="timeline-cut-time" class="timeline-cut-time"></span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "mediabunny": "../node_modules/mediabunny/dist/bundles/mediabunny.min.mjs"
        }
      }
    </script>
    <script type="module" src="../dist/browser/editor.js"></script>
  </body>
</html>
